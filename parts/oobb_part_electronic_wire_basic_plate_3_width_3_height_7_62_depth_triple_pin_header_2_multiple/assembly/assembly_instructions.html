<script>
'use strict';
const data=JSON.parse(document.getElementById('viewer-data').textContent);
const viewer=document.getElementById('viewer'),page=document.getElementById('page'),links=document.getElementById('links'),jump=document.getElementById('jump'),previous=document.getElementById('previous'),next=document.getElementById('next'),status=document.getElementById('status'),zoom=document.getElementById('zoom'),fullscreen=document.getElementById('fullscreen');
let current=0,startX=null,startY=null;
function linkElement(item){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.className='page-link';a.title=item.url;a.setAttribute('aria-label',item.url);['left','top','width','height'].forEach((k,i)=>a.style[k]=item.rect[i]*100+'%');return a;}
for(const slide of data.slides){const option=document.createElement('option');option.value=slide.id;option.textContent=slide.label;jump.append(option);const sheet=document.createElement('section'),image=document.createElement('img');sheet.className='print-page';image.src=data.images[slide.image];image.alt=slide.label;sheet.append(image);for(const item of slide.links)sheet.append(linkElement(item));document.getElementById('print-pages').append(sheet);}
function show(index,updateHash=true){current=Math.max(0,Math.min(data.slides.length-1,index));const slide=data.slides[current];page.src=data.images[slide.image];page.alt='AI-generated landscape A4 assembly page '+slide.number+': '+slide.label;links.replaceChildren(...slide.links.map(linkElement));jump.value=slide.id;status.textContent='Page '+slide.number+' / '+data.slides.length;previous.disabled=current===0;next.disabled=current===data.slides.length-1;viewer.scrollTop=0;viewer.scrollLeft=0;if(updateHash&&location.hash!=='#'+slide.id)location.hash=slide.id;}
function fromHash(){const hash=location.hash.slice(1);let index=data.slides.findIndex(s=>s.id===hash);if(index<0&&/^step-\d+$/.test(hash)){const step=Number(hash.slice(5));index=data.slides.findIndex(s=>s.steps.includes(step));if(index<0&&step===data.step_count+1)index=data.slides.findIndex(s=>s.kind==='summary');}if(index<0)index=data.slides.findIndex(s=>s.id===data.start);show(Math.max(0,index),false);}
previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);jump.onchange=()=>show(data.slides.findIndex(s=>s.id===jump.value));window.addEventListener('hashchange',fromHash);
zoom.onclick=()=>{const enabled=document.body.classList.toggle('zoom');zoom.textContent=enabled?'Fit page':'Zoom';zoom.setAttribute('aria-pressed',String(enabled));};
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('unsupported');}catch(error){const notice=document.getElementById('notice');notice.textContent='Use your browser’s full-screen control.';notice.hidden=false;setTimeout(()=>notice.hidden=true,3500);}}
fullscreen.onclick=full;document.addEventListener('fullscreenchange',()=>fullscreen.textContent=document.fullscreenElement?'Exit full screen':'Full screen');document.getElementById('print').onclick=()=>window.print();
document.addEventListener('keydown',event=>{if(event.target.tagName==='SELECT'||event.ctrlKey||event.metaKey||event.altKey)return;if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();show(current+1);}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(current-1);}else if(event.key==='Home'){event.preventDefault();show(0);}else if(event.key==='End'){event.preventDefault();show(data.slides.length-1);}else if(event.key.toLowerCase()==='f')full();});
viewer.addEventListener('pointerdown',event=>{if(event.target.closest('a')||document.body.classList.contains('zoom'))return;startX=event.clientX;startY=event.clientY;viewer.setPointerCapture(event.pointerId);});
viewer.addEventListener('pointerup',event=>{if(startX===null)return;const dx=event.clientX-startX,dy=event.clientY-startY;startX=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)show(current+(dx<0?1:-1));});viewer.addEventListener('pointercancel',()=>startX=null);page.draggable=false;
fromHash();
</script>
